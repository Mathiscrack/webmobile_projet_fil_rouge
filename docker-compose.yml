name: top_spot
services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - top_spot

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - mariadb
    networks:
      - top_spot

  api:
    build: .
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      - uploads:/app/uploads
    networks:
      - top_spot

networks:
  top_spot:
    driver: bridge

volumes:
  mariadb_data:
  uploads:
